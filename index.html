<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="background-grid" aria-hidden="true"></div>
    <div class="domain-backdrop" aria-hidden="true"></div>
    <div class="domain-river" aria-hidden="true"></div>
    <div class="domain-slashes" aria-hidden="true">
        <span class="slash slash-one"></span>
        <span class="slash slash-two"></span>
        <span class="slash slash-three"></span>
        <span class="slash slash-four"></span>
        <span class="slash slash-five"></span>
        <span class="slash slash-six"></span>
        <span class="slash slash-seven"></span>
        <span class="slash slash-eight"></span>
        <span class="slash slash-nine"></span>
        <span class="slash slash-ten"></span>
        <span class="slash slash-eleven"></span>
        <span class="slash slash-twelve"></span>
        <span class="slash slash-thirteen"></span>
        <span class="slash slash-fourteen"></span>
        <span class="slash slash-fifteen"></span>
        <span class="slash slash-sixteen"></span>
        <span class="slash slash-seventeen"></span>
        <span class="slash slash-eighteen"></span>
        <span class="slash slash-nineteen"></span>
        <span class="slash slash-twenty"></span>
        <span class="slash slash-twenty-one"></span>
        <span class="slash slash-twenty-two"></span>
        <span class="slash slash-twenty-three"></span>
        <span class="slash slash-twenty-four"></span>
    </div>
    <div class="domain-dry-person" aria-hidden="true">
        <span class="dry-person-head"></span>
        <span class="dry-person-hair"></span>
        <span class="dry-person-body"></span>
        <span class="dry-person-sash"></span>
        <span class="dry-person-arm arm-left"></span>
        <span class="dry-person-arm arm-right"></span>
        <span class="dry-person-leg leg-left"></span>
        <span class="dry-person-leg leg-right"></span>
    </div>
    <div class="domain-dry-person dry-person-woman" aria-hidden="true">
        <span class="dry-person-head"></span>
        <span class="dry-person-hair"></span>
        <span class="dry-person-body"></span>
        <span class="dry-person-sash"></span>
        <span class="dry-person-arm arm-left"></span>
        <span class="dry-person-arm arm-right"></span>
        <span class="dry-person-leg leg-left"></span>
        <span class="dry-person-leg leg-right"></span>
    </div>
    <div class="domain-dry-person dry-person-child" aria-hidden="true">
        <span class="dry-person-head"></span>
        <span class="dry-person-hair"></span>
        <span class="dry-person-body"></span>
        <span class="dry-person-sash"></span>
        <span class="dry-person-arm arm-left"></span>
        <span class="dry-person-arm arm-right"></span>
        <span class="dry-person-leg leg-left"></span>
        <span class="dry-person-leg leg-right"></span>
    </div>
    <main class="content">
        <div class="dog-scene">
            <div class="speech-bubble" aria-live="polite"></div>
            <div class="domain-popup domain-popup-primary" aria-live="polite"></div>
            <div class="domain-popup domain-popup-secondary" aria-live="polite"></div>
            <div class="domain-tomb" aria-hidden="true">
                <span class="tomb-horn horn-left"></span>
                <span class="tomb-horn horn-right"></span>
                <span class="tomb-roof"></span>
                <span class="tomb-body"></span>
                <span class="tomb-gate"></span>
                <span class="tomb-skull skull-left"></span>
                <span class="tomb-skull skull-right"></span>
                <span class="tomb-skull skull-mid-left"></span>
                <span class="tomb-skull skull-mid-right"></span>
                <span class="tomb-skull skull-small-left"></span>
                <span class="tomb-skull skull-small-right"></span>
                <span class="tomb-bone bone-left"></span>
                <span class="tomb-bone bone-right"></span>
                <span class="tomb-bone bone-mid-left"></span>
                <span class="tomb-bone bone-mid-right"></span>
                <span class="tomb-bone bone-small-left"></span>
                <span class="tomb-bone bone-small-right"></span>
            </div>
            <button class="demon-skill-icon" type="button" aria-label="Разозлить Дашу" aria-pressed="false">
                РАЗОЗЛИТЬ ДАШУ
            </button>

            <div class="balloon">
                <span class="balloon-knot"></span>
                <span class="balloon-string"></span>
            </div>

            <button class="dog" type="button" aria-label="Сказать фразу">
                <div class="dog-head">
                    <span class="sukuna-hair hair-one"></span>
                    <span class="sukuna-hair hair-two"></span>
                    <span class="sukuna-hair hair-three"></span>
                    <span class="sukuna-hair hair-four"></span>
                    <span class="sukuna-hair hair-five"></span>
                    <span class="sukuna-hair hair-six"></span>
                    <span class="sukuna-hair hair-seven"></span>
                    <span class="sukuna-hair hair-eight"></span>
                    <span class="sukuna-hair hair-nine"></span>
                    <span class="sukuna-hair hair-ten"></span>
                    <span class="sukuna-hair hair-eleven"></span>
                    <span class="sukuna-hair hair-twelve"></span>
                    <span class="sukuna-hair hair-thirteen"></span>
                    <span class="sukuna-hair hair-fourteen"></span>
                    <span class="ear ear-left"></span>
                    <span class="ear ear-right"></span>
                    <span class="sukuna-mark forehead-mark"></span>
                    <span class="sukuna-mark cheek-mark cheek-left"></span>
                    <span class="sukuna-mark cheek-mark cheek-right"></span>
                    <span class="sukuna-mark chin-mark"></span>
                    <span class="sukuna-mark chin-line chin-line-left"></span>
                    <span class="sukuna-mark chin-line chin-line-right"></span>
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="muzzle"></span>
                    <span class="nose"></span>
                    <span class="mouth"></span>
                </div>
                <div class="dog-body">
                    <span class="demon-robe robe-core"></span>
                    <span class="demon-robe robe-fold robe-fold-left"></span>
                    <span class="demon-robe robe-fold robe-fold-right"></span>
                    <span class="demon-arm demon-arm-left"><span class="demon-palm"></span></span>
                    <span class="demon-arm demon-arm-right"><span class="demon-palm"></span></span>
                    <span class="sukuna-mark body-mark body-line-one"></span>
                    <span class="sukuna-mark body-mark body-line-two"></span>
                    <span class="sukuna-mark body-mark body-star-one"></span>
                    <span class="sukuna-mark body-mark body-star-two"></span>
                    <span class="sukuna-mark body-mark body-rune"></span>
                    <span class="paw paw-left"></span>
                    <span class="paw paw-right"></span>
                    <span class="front-arm front-arm-left"></span>
                    <span class="front-arm front-arm-right"></span>
                </div>
            </button>
        </div>
    </main>
    <div class="people-crowd" aria-hidden="true">
        <div class="little-person person-one">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-two">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-three">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-four">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-five">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-six">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
    </div>
    <div class="rocket-layer" aria-hidden="true"></div>

    <script src="script.js"></script>
</body>
</html>
