<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="background-grid" aria-hidden="true"></div>
    <main class="content">
        <div class="dog-scene">
            <div class="speech-bubble" aria-live="polite"></div>

            <div class="balloon">
                <span class="balloon-knot"></span>
                <span class="balloon-string"></span>
            </div>

            <button class="dog" type="button" aria-label="Сказать фразу">
                <div class="dog-head">
                    <span class="ear ear-left"></span>
                    <span class="ear ear-right"></span>
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="muzzle"></span>
                    <span class="nose"></span>
                    <span class="mouth"></span>
                </div>
                <div class="dog-body">
                    <span class="paw paw-left"></span>
                    <span class="paw paw-right"></span>
                    <span class="tail"></span>
                </div>
            </button>
        </div>
    </main>
    <div class="people-crowd" aria-hidden="true">
        <div class="little-person person-one">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-two">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-three">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-four">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-five">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
        <div class="little-person person-six">
            <span class="person-head"></span>
            <span class="person-body"></span>
            <span class="person-arm person-arm-left"></span>
            <span class="person-arm person-arm-right"></span>
            <span class="person-leg person-leg-left"></span>
            <span class="person-leg person-leg-right"></span>
        </div>
    </div>
    <div class="rocket-layer" aria-hidden="true"></div>

    <script src="script.js"></script>
</body>
</html>
